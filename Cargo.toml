[package]
name = "tree-sitter-avenger-sql"
description = "The Tree-sitter grammar of avenger-sql"
version = "0.1.0"
authors = ["Jon Mease"]
license = "MIT"
readme = "README.md"
keywords = ["avenger", "incremental", "parsing", "sql", "tree-sitter"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/avenger-vis/tree-sitter-avenger-sql"
edition = "2021"
rust-version = "1.90"
autoexamples = false
build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "/README.md",
  "/bindings/c/**",
  "/bindings/rust/**",
  "/format/grammar.js",
  "/format/tree-sitter.json",
  "/format/queries/**",
  "/format/src/**",
  "/grammar.js",
  "/grammar/**",
  "/queries/**",
  "/src/**",
  "/tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "=0.27.2"
