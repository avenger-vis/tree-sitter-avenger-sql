name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-generated
      - run: npm test
      - run: npm run measure -- --check
      - run: npm pack --dry-run

  keywords:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tree-sitter-avenger-sql
      - uses: actions/checkout@v4
        with:
          repository: jonmmease/avenger
          ref: df17e4f2f7c1819419222475d301957785d4961c
          path: avenger
          sparse-checkout: avenger-sql-syntax/src/syntax_kind.rs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: tree-sitter-avenger-sql
        run: node scripts/sync_keywords.mjs --avenger-root ../avenger --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release

  scanner-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: sh scripts/test_scanner_sanitizers.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run test:wasm

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:fuzz
