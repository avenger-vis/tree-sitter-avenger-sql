name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cross_repo:
        description: Check synchronized fixtures against the unpublished Avenger source revision
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-generated
      - run: npm test
      - run: npm run test:highlights
      - run: npm run measure -- --check
      - run: npm pack --dry-run

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release

  scanner-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: sh scripts/test_scanner_sanitizers.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run test:wasm

  compiler-conformance:
    if: github.event_name == 'workflow_dispatch' && inputs.cross_repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tree-sitter-avenger-sql
      - uses: actions/checkout@v4
        with:
          repository: jonmmease/avenger
          ref: 3565e1f90ef5c48b3f6449c07d3824137543c320
          path: avenger
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tree-sitter-avenger-sql/package-lock.json
      - working-directory: tree-sitter-avenger-sql
        run: npm ci
      - working-directory: tree-sitter-avenger-sql
        run: npm run sync-conformance -- --avenger-root ../avenger --check

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:fuzz
